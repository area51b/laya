<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Run</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #f7f7f7;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #535353;
      font-size: 13px;
    }
    select {
      font: inherit;
      color: inherit;
    }
    canvas {
      background: #f7f7f7;
      border: 1px solid #d3d3d3;
    }
    p {
      margin: 12px 0 0;
      color: #535353;
      font-size: 13px;
    }
    .debug {
      width: min(600px, calc(100vw - 24px));
      margin-top: 10px;
      color: #535353;
      font-size: 12px;
    }
    .debug pre {
      max-height: 240px;
      overflow: auto;
      padding: 8px;
      background: #eee;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="manual">Manual</option>
      <option value="ai">AI</option>
    </select>
    <label>
      <input id="local-timing" type="checkbox">
      Local timing assist
    </label>
  </div>
  <canvas id="game" width="600" height="150"></canvas>
  <p>Space to start / restart · Manual: ↑ jump, ↓ duck</p>
  <details id="ai-debug" class="debug">
    <summary>AI debug</summary>
    <pre id="ai-debug-output">Waiting for an AI decision.</pre>
  </details>
  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const modeSelect = document.getElementById("mode");
      const localTimingToggle = document.getElementById("local-timing");
      const aiDebugDetails = document.getElementById("ai-debug");
      const aiDebugOutput = document.getElementById("ai-debug-output");
      // Logical game size. The bitmap itself is scaled to the screen's pixel ratio so
      // shapes stay sharp on high-DPI displays and when the browser is zoomed.
      const WIDTH = 600;
      const HEIGHT = 150;

      function fitCanvasToScreen() {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.round(WIDTH * ratio);
        canvas.height = Math.round(HEIGHT * ratio);
        canvas.style.width = WIDTH + "px";
        canvas.style.height = HEIGHT + "px";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }
      fitCanvasToScreen();
      window.addEventListener("resize", fitCanvasToScreen);

      // ---------------------------------------------------------------------------
      // Tunable constants
      // ---------------------------------------------------------------------------
      const GROUND_Y = 128;

      // Jump: ~0.55s air time, ~83px peak — snappy, not floaty (Chrome-like).
      const JUMP_VELOCITY = -600; // px/s (up)
      const GRAVITY = 2160;       // px/s^2

      const DINO_X = 44;
      const DINO_STAND_W = 44;
      const DINO_STAND_H = 47;
      const DINO_DUCK_W = 59;
      const DINO_DUCK_H = 25;
      const HITBOX_INSET = 6;     // shrink AABB vs visible sprite

      // Scroll speed vs score/distance. Start slower than the original 360 px/s.
      // Discrete steps approximate speed = BASE + k * score, with k chosen so a
      // continuous run hits MAX_SPEED at ~120s (score and distance stay proportional).
      const BASE_SPEED = 240;     // px/s (~4px/frame) — easier opening
      const MAX_SPEED = 780;      // px/s (~13px/frame) — unchanged ceiling
      const SCORE_PER_PIXEL = 0.05;
      const RAMP_SECONDS = 120;
      const SPEED_STEPS = 48;     // many small bumps instead of a few spikes
      const SPEED_RANGE = MAX_SPEED - BASE_SPEED;
      const SPEED_STEP = SPEED_RANGE / SPEED_STEPS; // ~11.25 px/s per step
      const SCORE_AT_MAX =
        SPEED_RANGE / (Math.log(MAX_SPEED / BASE_SPEED) / (SCORE_PER_PIXEL * RAMP_SECONDS));
      const SCORE_SPEED_STEP = SCORE_AT_MAX / SPEED_STEPS;

      // Spawn gaps: generous at the start, tighten toward the old feel at max speed.
      const MIN_GAP_EXTRA_START = 180;
      const MIN_GAP_EXTRA_END = 90;
      const GAP_RANDOM_START = 340;
      const GAP_RANDOM_END = 180;
      const SPAWN_START_DELAY = 520;
      const AI_LOOKAHEAD_DISTANCE = 650;
      const AI_JUMP_LEAD_SECONDS = 0.30;
      const AI_DUCK_LEAD_SECONDS = 0.35;
      const AI_EMPTY_POLL_MS = 300;

      const HIGH_SCORE_KEY = "dino-run-high-score";

      const STATE_START = "start";
      const STATE_PLAYING = "playing";
      const STATE_GAMEOVER = "gameover";

      const keys = { jump: false, duck: false };
      const dino = {
        x: DINO_X,
        y: GROUND_Y - DINO_STAND_H,
        w: DINO_STAND_W,
        h: DINO_STAND_H,
        vy: 0,
        grounded: true,
        ducking: false,
        runPhase: 0
      };

      let state = STATE_START;
      let speed = BASE_SPEED;
      let score = 0;
      let highScore = 0;
      let groundOffset = 0;
      let spawnDistance = SPAWN_START_DELAY;
      let obstacles = [];
      let lastTime = 0;
      let aiAction = "run";
      let aiBusy = false;
      let aiLastRequestAt = 0;
      let aiRequestId = 0;
      let aiAppliedAction = "run";
      let aiActionSource = "idle";
      let aiActionTarget = null;
      let aiDecisionTarget = null;
      let aiDecisionGroundedWhenReceived = false;
      let aiJumpPending = false;
      let aiHandledJumps = new WeakSet();
      let aiDebugLastRenderAt = 0;
      let aiDebugStatus = "idle";
      let aiDebugRequest = null;
      let aiDebugResponse = null;
      let aiDebugError = null;
      let aiDecisionHistory = [];
      let aiLatestDecision = null;
      let aiLatencySamples = [];

      function renderAiDebug() {
        aiDebugOutput.textContent = JSON.stringify({
          status: aiDebugStatus,
          mode: isAiMode() ? "AI" : "Manual",
          localTimingAssist: localTimingToggle.checked,
          averageDecisionLatencyMs: aiLatencySamples.length
            ? Math.round(aiLatencySamples.reduce(function (sum, latency) {
              return sum + latency;
            }, 0) / aiLatencySamples.length)
            : 0,
          current: {
            modelAction: aiAction,
            appliedAction: aiAppliedAction,
            actionSource: aiActionSource,
            actionTarget: aiActionTarget,
            lastDecisionTarget: aiDecisionTarget
              ? { kind: aiDecisionTarget.kind, variant: aiDecisionTarget.variant }
              : null,
            timingWindowsSeconds: {
              jump: AI_JUMP_LEAD_SECONDS,
              duck: AI_DUCK_LEAD_SECONDS
            },
            grounded: dino.grounded,
            ducking: dino.ducking,
            speed: Math.round(speed),
            score: Math.floor(score),
            obstacles: obstacles
              .filter(function (obstacle) {
                return obstacle.x + obstacle.w >= dino.x;
              })
              .sort(function (a, b) { return a.x - b.x; })
              .slice(0, 2)
              .map(function (obstacle) {
                return {
                  kind: obstacle.kind,
                  variant: obstacle.variant,
                  distance: Math.round(obstacle.x - (dino.x + dino.w)),
                  y: obstacle.y,
                  width: obstacle.w,
                  height: obstacle.h
                };
              })
          },
          lastRequest: aiDebugRequest,
          lastResponse: aiDebugResponse,
          lastDecisions: aiDecisionHistory,
          error: aiDebugError
        }, null, 2);
      }

      function isAiMode() {
        return modeSelect.value === "ai";
      }

      try {
        highScore = Number(localStorage.getItem(HIGH_SCORE_KEY) || 0) || 0;
      } catch (_err) {
        highScore = 0;
      }

      function jumpAirTime() {
        return (2 * Math.abs(JUMP_VELOCITY)) / GRAVITY;
      }

      function difficultyT(currentSpeed) {
        return Math.max(0, Math.min(1, (currentSpeed - BASE_SPEED) / SPEED_RANGE));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function minGapFor(obstacleWidth, currentSpeed) {
        // Horizontal distance covered during one jump, plus obstacle/dino width
        // so the widest cactus is always clearable, with room to land and jump again.
        const t = difficultyT(currentSpeed);
        const extra = lerp(MIN_GAP_EXTRA_START, MIN_GAP_EXTRA_END, t);
        const jumpClear = currentSpeed * jumpAirTime();
        return Math.max(
          obstacleWidth + dino.w + extra,
          jumpClear * 0.55 + obstacleWidth
        );
      }

      function cactusDefs() {
        return [
          { kind: "cactus", variant: "small", w: 12, h: 28 },
          { kind: "cactus", variant: "double", w: 26, h: 30 },
          { kind: "cactus", variant: "triple", w: 40, h: 42 }
        ];
      }

      function birdDefs() {
        const birdH = 16;
        const birdW = 28;
        return [
          // Head height: standing hits, ducking slips under.
          { kind: "bird", variant: "duck", w: birdW, h: birdH, y: GROUND_Y - DINO_STAND_H - 2 },
          // Low flight: duck still hits — must jump.
          { kind: "bird", variant: "jump", w: birdW, h: birdH, y: GROUND_Y - 28 },
          // High: already safe to run under.
          { kind: "bird", variant: "safe", w: birdW, h: birdH, y: 32 }
        ];
      }

      function pickObstacleType() {
        const t = Math.min(1, score / SCORE_AT_MAX);
        const cacti = cactusDefs();
        let pool = [cacti[0]];
        if (t >= 0.12) pool = pool.concat(cacti[1]);
        if (t >= 0.28) pool = pool.concat(cacti[2]);
        if (t >= 0.45) pool = pool.concat(birdDefs());
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function spawnObstacle() {
        const def = pickObstacleType();
        const y = def.kind === "bird" ? def.y : GROUND_Y - def.h;
        obstacles.push({
          kind: def.kind,
          variant: def.variant,
          x: WIDTH + 8,
          y: y,
          w: def.w,
          h: def.h,
          wing: 0
        });
        const t = difficultyT(speed);
        const extraRandom = lerp(GAP_RANDOM_START, GAP_RANDOM_END, t);
        const gap = minGapFor(def.w, speed) + Math.random() * extraRandom;
        spawnDistance = gap;
      }

      function resetGame() {
        aiRequestId++;
        aiBusy = false;
        aiLastRequestAt = 0;
        aiAction = "run";
        aiAppliedAction = "run";
        aiActionSource = "idle";
        aiActionTarget = null;
        aiDecisionTarget = null;
        aiJumpPending = false;
        aiDecisionHistory = [];
        aiLatestDecision = null;
        aiLatencySamples = [];
        aiHandledJumps = new WeakSet();
        keys.jump = false;
        keys.duck = false;
        speed = BASE_SPEED;
        score = 0;
        groundOffset = 0;
        spawnDistance = SPAWN_START_DELAY;
        obstacles = [];
        dino.x = DINO_X;
        dino.w = DINO_STAND_W;
        dino.h = DINO_STAND_H;
        dino.y = GROUND_Y - dino.h;
        dino.vy = 0;
        dino.grounded = true;
        dino.ducking = false;
        dino.runPhase = 0;
      }

      function setDucking(on) {
        if (on && !dino.grounded) return;
        if (on === dino.ducking) return;
        dino.ducking = on;
        if (on) {
          dino.w = DINO_DUCK_W;
          dino.h = DINO_DUCK_H;
        } else {
          dino.w = DINO_STAND_W;
          dino.h = DINO_STAND_H;
        }
        dino.y = GROUND_Y - dino.h;
      }

      function jump() {
        if (!dino.grounded) return;
        setDucking(false);
        dino.grounded = false;
        dino.vy = JUMP_VELOCITY;
      }

      function aabb(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function hitbox(entity, extraYInset) {
        const insetY = extraYInset == null ? HITBOX_INSET : extraYInset;
        return {
          x: entity.x + HITBOX_INSET,
          y: entity.y + insetY,
          w: Math.max(2, entity.w - HITBOX_INSET * 2),
          h: Math.max(2, entity.h - insetY * 2)
        };
      }

      function saveHighScore() {
        if (score > highScore) {
          highScore = Math.floor(score);
          try {
            localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
          } catch (_err) { /* ignore quota / private mode */ }
        }
      }

      function upcomingObstacles() {
        return obstacles
          .filter(function (obstacle) {
            return obstacle.x + obstacle.w >= dino.x;
          })
          .sort(function (a, b) { return a.x - b.x; });
      }

      function requestAiAction() {
        if (!isAiMode() || aiBusy) return;

        const upcoming = upcomingObstacles().slice(0, 2);
        const nearestDistance = upcoming.length
          ? upcoming[0].x - (dino.x + dino.w)
          : Infinity;
        const now = performance.now();
        if (nearestDistance > AI_LOOKAHEAD_DISTANCE &&
            now - aiLastRequestAt < AI_EMPTY_POLL_MS) return;

        const requestId = ++aiRequestId;
        aiBusy = true;
        aiLastRequestAt = now;
        const decisionTarget = upcoming.find(function (obstacle) {
          return obstacle.kind === "cactus" ||
            obstacle.variant === "duck" ||
            obstacle.variant === "jump";
        }) || null;
        const requestSnapshot = {
          grounded: dino.grounded,
          ducking: dino.ducking,
          speed: speed,
          score: score,
          decision_latency_ms: aiLatencySamples.length
            ? aiLatencySamples.reduce(function (sum, latency) {
              return sum + latency;
            }, 0) / aiLatencySamples.length
            : 0,
          obstacles: upcoming.map(function (obstacle) {
            return {
              kind: obstacle.kind,
              variant: obstacle.variant,
              x: obstacle.x - (dino.x + dino.w),
              y: obstacle.y,
              w: obstacle.w,
              h: obstacle.h
            };
          })
        };
        aiDebugRequest = requestSnapshot;
        aiDebugResponse = null;
        aiDebugError = null;
        aiDebugStatus = "request pending";
        renderAiDebug();
        const startedAt = performance.now();
        fetch("/dino/act", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestSnapshot)
        })
          .then(function (response) {
            if (!response.ok) throw new Error("AI action request failed: " + response.status);
            return response.json();
          })
          .then(function (result) {
            if (requestId !== aiRequestId || !isAiMode()) return;
            const latencyMs = Math.round(performance.now() - startedAt);
            aiLatencySamples.push(latencyMs);
            if (aiLatencySamples.length > 5) aiLatencySamples.shift();
            aiAction = ["run", "jump", "duck"].indexOf(result.action) !== -1
              ? result.action
              : "run";
            aiJumpPending = !localTimingToggle.checked &&
              result.action === "jump" &&
              requestSnapshot.grounded &&
              dino.grounded;
            aiDecisionTarget = decisionTarget;
            aiDecisionGroundedWhenReceived = dino.grounded;
            aiDebugResponse = {
              action: result.action,
              debug: result.debug || null,
              latencyMs: latencyMs,
              groundedWhenReceived: dino.grounded
            };
            aiLatestDecision = {
              receivedAt: new Date().toLocaleTimeString(),
              status: state === STATE_PLAYING ? "received" : "received after game ended",
              request: requestSnapshot,
              response: aiDebugResponse,
              appliedAction: state === STATE_PLAYING ? "pending" : "not applied (game ended)",
              actionSource: null,
              applicationReason: state === STATE_PLAYING ? "Waiting for game loop." : "Response arrived after game over."
            };
            aiDecisionHistory.push(aiLatestDecision);
            if (aiDecisionHistory.length > 5) aiDecisionHistory.shift();
            aiDebugStatus = "decision received";
            renderAiDebug();
          })
          .catch(function (error) {
            if (requestId !== aiRequestId) return;
            aiAction = "run";
            aiJumpPending = false;
            aiDebugError = error.message;
            aiDebugStatus = "request failed";
            renderAiDebug();
          })
          .finally(function () {
            if (requestId === aiRequestId) {
              aiBusy = false;
              renderAiDebug();
            }
          });
      }

      function applyLayaAction() {
        let action = aiAction;
        let applicationReason = "Laya chose run.";
        if (action === "jump") {
          if (aiJumpPending && dino.grounded) {
            aiJumpPending = false;
            jump();
            applicationReason = "Laya chose jump and the dino was grounded; jump started.";
          } else {
            action = "run";
            applicationReason = !aiLatestDecision ||
              !aiLatestDecision.request.grounded
              ? "Laya chose jump, but the dino was airborne in the request snapshot."
              : !aiDecisionGroundedWhenReceived
                ? "Laya chose jump, but the dino was already airborne when the response arrived."
                : "Laya chose jump, but a jump was no longer eligible when applied.";
          }
        } else {
          aiJumpPending = false;
          if (action === "duck") {
            // Only hold duck while a head-height bird is the nearest threat, so a
            // stale or wrong "duck" can never keep the dino crouched on its own.
            const nearestThreat = upcomingObstacles().find(function (obstacle) {
              return obstacle.kind === "cactus" ||
                obstacle.variant === "duck" ||
                obstacle.variant === "jump";
            });
            if (nearestThreat && nearestThreat.kind === "bird" && nearestThreat.variant === "duck") {
              applicationReason = "Laya chose duck.";
            } else {
              action = "run";
              applicationReason = "Laya chose duck, but no head-height bird is the nearest threat; released duck.";
            }
          }
        }

        aiAppliedAction = action;
        aiActionSource = "Laya";
        aiActionTarget = aiDecisionTarget
          ? { kind: aiDecisionTarget.kind, variant: aiDecisionTarget.variant }
          : null;
        keys.duck = action === "duck";
        if (aiLatestDecision && aiLatestDecision.appliedAction === "pending") {
          aiLatestDecision.appliedAction = action;
          aiLatestDecision.actionSource = "Laya";
          aiLatestDecision.applicationReason = applicationReason;
          aiLatestDecision.status = "applied";
        }
      }

      function updateAiControl() {
        if (!localTimingToggle.checked) {
          applyLayaAction();
          if (aiDebugDetails.open && performance.now() - aiDebugLastRenderAt >= 100) {
            aiDebugLastRenderAt = performance.now();
            renderAiDebug();
          }
          return;
        }

        const nearest = upcomingObstacles().find(function (obstacle) {
          return obstacle.kind === "cactus" ||
            obstacle.variant === "duck" ||
            obstacle.variant === "jump";
        });
        let action = "run";
        let source = "waiting";
        let target = null;

        if (nearest) {
          const distance = nearest.x - (dino.x + dino.w);
          const isHeadBird = nearest.kind === "bird" && nearest.variant === "duck";
          const isOverlapping = nearest.x < dino.x + dino.w &&
            nearest.x + nearest.w > dino.x;
          target = {
            kind: nearest.kind,
            variant: nearest.variant,
            distance: Math.round(distance),
            timeToContact: Math.max(0, distance) / speed
          };

          if (isHeadBird && dino.grounded &&
              (isOverlapping || (distance >= 0 && distance <= speed * AI_DUCK_LEAD_SECONDS))) {
            action = "duck";
          } else if (!isHeadBird && dino.grounded &&
              !aiHandledJumps.has(nearest) &&
              distance >= -HITBOX_INSET * 2 &&
              distance <= speed * AI_JUMP_LEAD_SECONDS) {
            action = "jump";
          }

          if (action !== "run") {
            source = aiAction === action && aiDecisionTarget === nearest
              ? "Laya"
              : "local timing safety";
            if (action === "jump") aiHandledJumps.add(nearest);
          } else if (!dino.grounded) {
            source = "airborne";
          } else if (aiAction !== "run") {
            source = "Laya action outside local timing window";
          }
        }

        aiAppliedAction = action;
        aiActionSource = source;
        aiActionTarget = target;
        keys.duck = action === "duck";
        if (action === "jump") jump();
        if (aiLatestDecision && aiLatestDecision.appliedAction === "pending") {
          aiLatestDecision.appliedAction = action;
          aiLatestDecision.actionSource = source;
          aiLatestDecision.applicationReason = "Applied by " + source + ".";
          aiLatestDecision.status = "applied";
        }

        if (aiDebugDetails.open && performance.now() - aiDebugLastRenderAt >= 100) {
          aiDebugLastRenderAt = performance.now();
          renderAiDebug();
        }
      }

      function updatePlaying(dt) {
        if (isAiMode()) {
          requestAiAction();
          updateAiControl();
        }

        if (keys.duck) {
          setDucking(true);
        } else if (dino.ducking && dino.grounded) {
          setDucking(false);
        }

        if (!dino.grounded) {
          dino.vy += GRAVITY * dt;
          dino.y += dino.vy * dt;
          const floor = GROUND_Y - dino.h;
          if (dino.y >= floor) {
            dino.y = floor;
            dino.vy = 0;
            dino.grounded = true;
            if (keys.duck) setDucking(true);
          }
        }

        groundOffset = (groundOffset + speed * dt) % 24;
        if (dino.grounded && !dino.ducking) dino.runPhase += speed * dt;

        spawnDistance -= speed * dt;
        if (spawnDistance <= 0) spawnObstacle();

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.x -= speed * dt;
          if (ob.kind === "bird") ob.wing += dt * 10;
          if (ob.x + ob.w < -20) obstacles.splice(i, 1);
        }

        const dinoBox = hitbox(dino, dino.ducking ? 2 : HITBOX_INSET);
        for (let i = 0; i < obstacles.length; i++) {
          if (aabb(dinoBox, hitbox(obstacles[i], 3))) {
            saveHighScore();
            state = STATE_GAMEOVER;
            return;
          }
        }

        score += speed * dt * SCORE_PER_PIXEL;
        const steps = Math.floor(score / SCORE_SPEED_STEP);
        speed = Math.min(MAX_SPEED, BASE_SPEED + steps * SPEED_STEP);
      }

      function padScore(n) {
        return String(Math.floor(n)).padStart(5, "0");
      }

      function drawGround() {
        ctx.strokeStyle = "#535353";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(WIDTH, GROUND_Y);
        ctx.stroke();

        ctx.strokeStyle = "#c2c2c2";
        ctx.lineWidth = 1;
        for (let x = -groundOffset; x < WIDTH; x += 24) {
          ctx.beginPath();
          ctx.moveTo(x, GROUND_Y + 6);
          ctx.lineTo(x + 10, GROUND_Y + 6);
          ctx.stroke();
        }
      }

      // DINO-SPRITE-START
      // Vector dino, facing right. Every pose is drawn inside the dino's hitbox
      // (44x47 standing, 59x25 ducking) with its top-left corner at (dino.x, dino.y).
      const DINO_COLOR = "#535353";
      const DINO_EYE = "#f7f7f7";

      // Leg poses as [hip, knee, ankle, toe] points in sprite coordinates.
      const DINO_LEGS_RUN = [
        [ // frame 0: near leg planted, far leg swinging
          [[17, 32], [19, 38.5], [17.5, 43], [23, 44.75]],
          [[24, 32], [28, 37], [25.5, 40.5], [30, 41]]
        ],
        [ // frame 1: legs swapped
          [[25, 32], [27, 38.5], [25.5, 43], [31, 44.75]],
          [[17, 32], [14, 37], [16.5, 40.5], [21, 41]]
        ]
      ];
      const DINO_LEGS_JUMP = [
        [[17, 32], [14, 38], [10, 42], [14.5, 43.5]],
        [[24, 32], [29, 37], [33, 41], [38, 41.5]]
      ];
      const DINO_LEGS_DUCK = [
        [[18, 16], [16, 21], [17, 23], [22, 23.4]],
        [[34, 16], [36, 21], [35, 23], [40, 23.4]]
      ];

      function dinoLegs(legs, width) {
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = 0; i < legs.length; i++) {
          const leg = legs[i];
          ctx.beginPath();
          ctx.moveTo(leg[0][0], leg[0][1]);
          for (let p = 1; p < leg.length; p++) ctx.lineTo(leg[p][0], leg[p][1]);
          ctx.stroke();
        }
      }

      function dinoSpikes(spikes) {
        // spike = [baseLeft, baseRight, baseY, apexX, apexY]
        for (let i = 0; i < spikes.length; i++) {
          const s = spikes[i];
          ctx.beginPath();
          ctx.moveTo(s[0], s[2]);
          ctx.lineTo(s[3], s[4]);
          ctx.lineTo(s[1], s[2]);
          ctx.closePath();
          ctx.fill();
        }
      }

      function dinoEye(cx, cy) {
        ctx.fillStyle = DINO_EYE;
        ctx.beginPath();
        ctx.arc(cx, cy, 1.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = DINO_COLOR;
        ctx.beginPath();
        ctx.arc(cx + 0.5, cy, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }

      function dinoStandingBody() {
        ctx.beginPath();
        ctx.moveTo(0, 31);                              // tail tip
        ctx.bezierCurveTo(3, 28, 7, 25, 12, 23.5);      // top of the tail
        ctx.bezierCurveTo(16, 22, 20, 19.5, 24.5, 18);  // back
        ctx.bezierCurveTo(26.5, 17.2, 27.2, 15.8, 27.4, 14); // base of the neck
        ctx.bezierCurveTo(28, 10, 28, 6, 31, 3.5);      // neck up to the head
        ctx.bezierCurveTo(34, 1, 39, 1, 42, 4);         // top of the head
        ctx.bezierCurveTo(44, 6, 44, 10, 42, 12);       // snout
        ctx.bezierCurveTo(40, 14, 36, 14, 33, 14);      // jaw
        ctx.bezierCurveTo(31, 15, 31, 19, 31, 22);      // throat and chest
        ctx.bezierCurveTo(30, 30, 26, 36, 19, 36);      // belly
        ctx.bezierCurveTo(15, 36, 12, 33, 8.5, 31.5);   // underside toward the tail
        ctx.bezierCurveTo(5, 30.3, 2, 30.3, 0, 31);     // underside of the tail
        ctx.closePath();
        ctx.fill();
      }

      function dinoStandingDetails() {
        dinoSpikes([
          [9.5, 14.5, 24.6, 11, 17.5],
          [15, 20, 22.8, 17, 15.5],
          [20.5, 25, 19.8, 22.5, 13.5]
        ]);
        // tiny arm
        ctx.strokeStyle = DINO_COLOR;
        ctx.lineWidth = 2.6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(30, 22);
        ctx.lineTo(34, 25.5);
        ctx.lineTo(36.5, 24.5);
        ctx.stroke();
        dinoEye(37, 6.5);
        // mouth line
        ctx.strokeStyle = DINO_EYE;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(42.2, 10);
        ctx.lineTo(36, 10.6);
        ctx.stroke();
      }

      function drawDinoStanding(legs) {
        ctx.fillStyle = DINO_COLOR;
        ctx.strokeStyle = DINO_COLOR;
        dinoLegs(legs, 4.5);
        dinoStandingBody();
        dinoStandingDetails();
      }

      function drawDinoDuck() {
        ctx.fillStyle = DINO_COLOR;
        ctx.strokeStyle = DINO_COLOR;
        dinoLegs(DINO_LEGS_DUCK, 4);
        ctx.beginPath();
        ctx.moveTo(0, 14);                           // tail tip
        ctx.bezierCurveTo(6, 10, 12, 8, 20, 8);      // tail up to the back
        ctx.bezierCurveTo(28, 8, 36, 7, 42, 6);      // back
        ctx.bezierCurveTo(44, 2, 48, 0, 52, 0);      // neck to the top of the head
        ctx.bezierCurveTo(56, 0, 58, 2, 59, 5);      // forehead
        ctx.bezierCurveTo(59.5, 8, 58, 11, 55, 12);  // snout
        ctx.bezierCurveTo(52, 13, 48, 13, 45, 13);   // jaw
        ctx.bezierCurveTo(43, 16, 40, 17, 36, 17);   // throat and chest
        ctx.bezierCurveTo(28, 18, 18, 18, 12, 17);   // belly
        ctx.bezierCurveTo(7, 16, 3, 15, 0, 14);      // underside of the tail
        ctx.closePath();
        ctx.fill();
        dinoSpikes([
          [10, 15, 9.5, 12, 3.5],
          [17.5, 22.5, 8.8, 20, 3],
          [25.5, 30.5, 8.4, 28, 2.5],
          [33.5, 38.5, 7.8, 36, 2]
        ]);
        dinoEye(53, 5.2);
        ctx.strokeStyle = DINO_EYE;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(58.2, 9);
        ctx.lineTo(51, 10.2);
        ctx.stroke();
      }

      function drawDino() {
        ctx.save();
        // Whole-pixel origin keeps the edges crisp while the dino moves.
        ctx.translate(Math.round(dino.x), Math.round(dino.y));
        if (dino.ducking) {
          drawDinoDuck();
        } else if (!dino.grounded) {
          drawDinoStanding(DINO_LEGS_JUMP);
        } else {
          drawDinoStanding(DINO_LEGS_RUN[Math.floor(dino.runPhase / 28) % 2]);
        }
        ctx.restore();
      }
      // DINO-SPRITE-END

      function drawCactus(ob) {
        ctx.fillStyle = "#535353";
        const unit = ob.variant === "small" ? 1 : ob.variant === "double" ? 2 : 3;
        const stemW = 8;
        const gap = (ob.w - stemW * unit) / Math.max(1, unit + 1);
        for (let i = 0; i < unit; i++) {
          const sx = ob.x + gap * (i + 1) + stemW * i;
          ctx.fillRect(sx, ob.y, stemW, ob.h);
          ctx.fillRect(sx - 4, ob.y + ob.h * 0.35, 4, 3);
          ctx.fillRect(sx + stemW, ob.y + ob.h * 0.5, 4, 3);
        }
      }

      function drawBird(ob) {
        ctx.fillStyle = "#535353";
        const flap = Math.sin(ob.wing) > 0;
        ctx.fillRect(ob.x + 6, ob.y + 6, ob.w - 10, 8);
        ctx.fillRect(ob.x + ob.w - 8, ob.y + 8, 8, 4);
        if (flap) {
          ctx.fillRect(ob.x + 10, ob.y, 12, 6);
        } else {
          ctx.fillRect(ob.x + 10, ob.y + 12, 12, 6);
        }
      }

      function drawHud() {
        ctx.fillStyle = "#535353";
        ctx.font = "14px ui-monospace, SFMono-Regular, Menlo, monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        const live = padScore(score);
        const hi = "HI " + padScore(highScore);
        ctx.fillText(hi + "  " + live, WIDTH - 10, 8);
        if (isAiMode()) {
          ctx.textAlign = "left";
          ctx.fillText("AI: " + aiAppliedAction, 10, 8);
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = "rgba(247, 247, 247, 0.72)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "#535353";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 16px system-ui, sans-serif";
        ctx.fillText(title, WIDTH / 2, HEIGHT / 2 - 10);
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillText(subtitle, WIDTH / 2, HEIGHT / 2 + 12);
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawGround();
        for (let i = 0; i < obstacles.length; i++) {
          const ob = obstacles[i];
          if (ob.kind === "bird") drawBird(ob);
          else drawCactus(ob);
        }
        drawDino();
        drawHud();

        if (state === STATE_START) {
          drawOverlay("Dino Run", "Press Space to Start");
        } else if (state === STATE_GAMEOVER) {
          drawOverlay(
            "Game Over  " + padScore(score),
            "Press Space to Restart"
          );
        }
      }

      function update(dt) {
        if (state === STATE_PLAYING) updatePlaying(dt);
      }

      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function isJumpKey(e) {
        return e.code === "Space" || e.code === "ArrowUp";
      }

      modeSelect.addEventListener("change", function () {
        aiRequestId++;
        aiBusy = false;
        aiLastRequestAt = 0;
        aiAction = "run";
        aiAppliedAction = "run";
        aiActionSource = "idle";
        aiActionTarget = null;
        aiDecisionTarget = null;
        aiDecisionGroundedWhenReceived = false;
        aiJumpPending = false;
        keys.jump = false;
        keys.duck = false;
        aiDebugStatus = "idle";
        aiDebugError = null;
        renderAiDebug();
      });

      localTimingToggle.addEventListener("change", function () {
        aiJumpPending = false;
        aiAppliedAction = "run";
        aiActionSource = localTimingToggle.checked ? "local timing enabled" : "Laya only";
        aiActionTarget = null;
        renderAiDebug();
      });

      window.addEventListener("keydown", function (e) {
        if (isJumpKey(e) || e.code === "ArrowDown") e.preventDefault();

        if (isJumpKey(e)) {
          if (state === STATE_START) {
            resetGame();
            state = STATE_PLAYING;
            return;
          }
          if (state === STATE_GAMEOVER) {
            resetGame();
            state = STATE_PLAYING;
            return;
          }
          if (isAiMode()) return;
          keys.jump = true;
          jump();
        }

        if (e.code === "ArrowDown" && !(isAiMode() && state === STATE_PLAYING)) {
          keys.duck = true;
        }
      });

      window.addEventListener("keyup", function (e) {
        if (isJumpKey(e)) keys.jump = false;
        if (e.code === "ArrowDown" && !isAiMode()) keys.duck = false;
      });

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
